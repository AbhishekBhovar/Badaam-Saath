const S=[{k:'H',s:'♥',r:1},{k:'D',s:'♦',r:1},{k:'C',s:'♣',r:0},{k:'S',s:'♠',r:0}],q=x=>document.querySelector(x);let sel=[0,1,14],filter='All',players=[],hands=[[],[],[],[]],bounds={},turn=0,active=false,busy=false,scores=[0,0,0,0],token=0;const rn=n=>n==1?'A':n==11?'J':n==12?'Q':n==13?'K':n;function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));q('#'+x).classList.add('on')}function filters(){let groups=['All','YJHD','ZNMD','Hera Pheri'];q('#filters').innerHTML='';groups.forEach(g=>{let b=document.createElement('button');b.textContent=g;b.className=g==filter?'on':'';b.onclick=()=>{filter=g;filters();roster()};q('#filters').appendChild(b)})}function roster(){q('#roster').innerHTML='';P.forEach((p,i)=>{if(filter!='All'&&p.group!=filter)return;let b=document.createElement('button');b.className='person '+(sel.includes(i)?'sel':'');b.innerHTML=`<span class="tick">✓</span><img src="${p.img}" alt=""><div class="meta"><b>${p.name}</b><div><span class="stars">${'★'.repeat(p.stars)}${'☆'.repeat(5-p.stars)}</span><span class="diff">${p.diff}</span></div><div class="trait">${p.trait}</div></div>`;b.onclick=()=>{if(sel.includes(i))sel=sel.filter(x=>x!=i);else if(sel.length<3)sel.push(i);roster()};q('#roster').appendChild(b)});q('#start').textContent=`Start Game · ${sel.length}/3 →`}function deck(){return S.flatMap(s=>Array.from({length:13},(_,i)=>({s:s.k,sym:s.s,red:s.r,r:i+1})))}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function legal(c){let b=bounds[c.s];return b?c.r==b.lo-1||c.r==b.hi+1:c.r==7}function opts(p){return hands[p].filter(legal)}function ai(p){let o=opts(p);if(!o.length)return null;const st=players[p].style;if(st==='open')return [...o].sort((a,b)=>(!bounds[b.s])-(!bounds[a.s])||b.r-a.r)[0];if(st==='expert'||st==='block')return [...o].sort((a,b)=>(!!bounds[b.s])-(!!bounds[a.s])||b.r-a.r)[0];if(st==='safe')return [...o].sort((a,b)=>a.r-b.r)[0];if(st==='she
