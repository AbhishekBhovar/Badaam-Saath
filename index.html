<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160d08">
<title>Badaam Saat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#100906;color:#f7ead5;font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif}button{font:inherit}.app{max-width:760px;margin:auto;min-height:100dvh;background:#110a06}.screen{display:none;min-height:100dvh}.screen.on{display:block}
.home{position:relative;overflow:hidden}.hero{height:100dvh;min-height:690px;position:relative;background:linear-gradient(180deg,#0001 30%,#100906 83%),url("assets/home.jpg") center 18%/cover no-repeat}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0005,transparent 28% 72%,#0005);pointer-events:none}.brand{position:absolute;left:7%;right:7%;top:10%;z-index:2}.brand h1{font-family:Georgia,serif;font-style:italic;font-size:clamp(52px,15vw,88px);line-height:.79;margin:0;letter-spacing:-4px;text-shadow:0 5px 22px #000}.brand p{margin:18px 0 0;font-size:16px;text-shadow:0 2px 8px #000}.homeActions{position:absolute;left:5%;right:5%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:3;display:grid;gap:10px}.modePick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modePick button{border:1px solid #755035;background:#17100de8;color:#ead9be;border-radius:13px;padding:11px;font-weight:900}.modePick button.on{border-color:#e4ad4e;background:#3b2516;box-shadow:inset 0 0 0 1px #e4ad4e55}.bigbtn{border:1px solid #e2a84e;border-radius:16px;background:linear-gradient(#c84c34,#9f2d24);color:#fff1d8;padding:16px;font-weight:900;font-size:19px;box-shadow:0 8px 25px #0008,inset 0 0 0 2px #ffbf5740}.secondary{background:#17100de8}.tinyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tinyrow button{border:1px solid #6e5139;background:#17100ddd;color:#ead7b9;border-radius:13px;padding:10px 6px;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:#130d09;position:sticky;top:0;z-index:20}.top h2{margin:0;font-size:20px}.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid #5e422d;background:#1e140d;color:#f1d7aa;font-size:20px}.choose{padding:0 12px 22px;background:linear-gradient(#130d09,#0d0906)}.choose p{margin:0 0 13px;color:#bca78d;font-size:13px}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.person{border:1px solid #59412d;background:#1b120d;border-radius:14px;padding:0;overflow:hidden;text-align:left;color:#f5e7d1;position:relative}.person.sel{border-color:#e6ad4c;box-shadow:0 0 0 2px #e6ad4c33}.person img{display:block;width:100%;aspect-ratio:1/1.05;object-fit:cover;object-position:center top}.person .meta{padding:9px}.person b{font-size:15px}.stars{color:#eab24c;font-size:11px;margin-top:2px}.trait{font-size:10px;color:#c7b39a;line-height:1.25;margin-top:4px;min-height:25px}.tick{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e2aa4a;color:#1c1109;font-weight:900;opacity:0}.sel .tick{opacity:1}.startbar{position:sticky;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0d0906 25%)}.startbar button{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(#efc568,#d99c32);font-weight:900;color:#2b180a;font-size:16px}
.game{background:#100906}.table{height:100dvh;min-height:690px;position:relative;overflow:hidden;background:linear-gradient(#0005,#0000 18%,#0000 76%,#0008),url("assets/table-clean.jpg") center/cover no-repeat}.table:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 85px #0008;pointer-events:none}
.gameTop{position:absolute;z-index:30;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}.gameTop button{border:1px solid #8d663f;background:#17100bd9;color:#f6e2bd;border-radius:13px;padding:10px 12px;font-weight:800;backdrop-filter:blur(8px)}.round{background:#17100bd9;border:1px solid #6b4b31;border-radius:999px;padding:8px 12px;font-weight:900;font-size:12px;backdrop-filter:blur(8px)}
.prop{position:absolute;z-index:2;pointer-events:none;filter:drop-shadow(0 10px 10px #0007)}.chai{right:-8px;top:94px;width:58px;height:84px;border-radius:7px 7px 17px 17px;border:4px solid #ead8b599;background:linear-gradient(90deg,#fff2,#8d4a1dcc,#fff2);opacity:.82}.chai:before{content:"";position:absolute;left:5px;right:5px;top:8px;height:8px;background:#6e3515;border-radius:50%}.snack{left:-28px;top:110px;width:98px;height:72px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#f7b82e 0 8%,#d96f16 9% 18%,#f4a426 19% 28%,#b65b16 29% 37%,#ed9720 38% 49%,#3a1b0d 51%);border:5px solid #4b2717;opacity:.86}
.seat{position:absolute;z-index:9;text-align:center;font-size:11px;text-shadow:0 2px 5px #000}.seat img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #dba84c;box-shadow:0 5px 14px #0008}.seat b{display:block;font-size:12px;margin-top:1px}.seat span{opacity:.9}.north{top:58px;left:50%;transform:translateX(-50%)}.west{left:8px;top:27%}.east{right:8px;top:27%}.backs{display:flex;justify-content:center;margin-top:3px}.back{width:16px;height:25px;border-radius:3px;margin-left:-7px;background:repeating-linear-gradient(45deg,#a92d34 0 3px,#e56862 3px 6px);border:1px solid #f3c2a5;box-shadow:0 2px 4px #0005}
.board{position:absolute;left:8%;right:8%;top:22%;bottom:24%;z-index:5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:center}.lane{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.suit{font-size:20px;font-weight:900;margin-bottom:6px;text-shadow:0 2px 4px #fff2}.red{color:#d53b43}.stack{height:78%;width:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}.mini{width:clamp(48px,13vw,62px);aspect-ratio:.69;border-radius:7px;background:linear-gradient(145deg,#fff,#f5ede0);color:#21140e;border:1px solid #d7c6ad;display:flex;align-items:flex-start;justify-content:flex-start;padding:5px;font-weight:900;font-size:13px;box-shadow:0 5px 9px #0007;position:absolute;left:50%;transform:translateX(-50%) translateY(var(--y)) rotate(var(--r));transition:.18s}.mini.red{color:#cf3039}.mini.seven{z-index:15;box-shadow:0 6px 12px #0008,0 0 0 1px #f0c15c}.ghost{width:clamp(48px,13vw,62px);aspect-ratio:.69;border:1px dashed #e0c69d77;border-radius:7px;display:grid;place-items:center;color:#f3d9ad88;font-weight:900}
.toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:12;color:#f8e6ca;font-weight:850;font-size:11px;white-space:nowrap;text-shadow:0 2px 5px #000;background:#1a1009b8;border:1px solid #795638;border-radius:999px;padding:6px 10px;backdrop-filter:blur(7px)}.you{position:absolute;left:50%;bottom:91px;transform:translateX(-50%);z-index:12;font-size:10px;opacity:.9;text-shadow:0 2px 4px #000}
.hand{position:absolute;left:0;right:0;bottom:-15px;height:120px;z-index:10;pointer-events:none}.card{position:absolute;left:50%;bottom:0;width:clamp(54px,15vw,66px);aspect-ratio:.69;border:1px solid #d4c4ad;border-radius:9px;background:linear-gradient(145deg,#fff,#f6efe4);box-shadow:0 7px 13px #0008;padding:6px;text-align:left;font-weight:900;font-size:14px;color:#241711;transform-origin:50% 115%;transition:.15s transform,.15s filter;pointer-events:auto}.card.red{color:#c9303a}.card.playable{filter:brightness(1.08) drop-shadow(0 0 6px #f0c66b99)}.card.selected{filter:brightness(1.12) drop-shadow(0 0 9px #f0c66bbb)}.card .big{position:absolute;right:6px;bottom:4px;font-size:23px}.pass{position:absolute;right:10px;bottom:102px;z-index:13;border:1px solid #805c3d;background:#17100dcc;color:#f5dfbc;border-radius:12px;padding:8px 10px;font-weight:900;font-size:11px}.pass:disabled{opacity:0;pointer-events:none}
.scoreOverlay{display:none;position:absolute;inset:9% 6%;z-index:40;background:#120c08f5;border:1px solid #65482f;border-radius:20px;padding:14px;box-shadow:0 20px 60px #000}.scoreOverlay.on{display:block}.scoreOverlay table{width:100%;border-collapse:collapse;font-size:12px}.scoreOverlay th,.scoreOverlay td{padding:7px 3px;border-bottom:1px solid #4b3626;text-align:center}.scoreOverlay th:first-child,.scoreOverlay td:first-child{text-align:left}.close{float:right;border:0;border-radius:10px;padding:8px;background:#2c1d13;color:#f2dab5}
@media(max-width:390px){.roster{gap:7px}.person .meta{padding:7px}.table{min-height:640px}.board{left:7%;right:7%;gap:3px}.seat img{width:45px;height:45px}.west{left:4px}.east{right:4px}.card{width:54px}.toast{bottom:113px}}
@media(min-width:600px){.roster{grid-template-columns:repeat(3,1fr)}.board{left:18%;right:18%}.card{width:68px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main class="app">
<section id="home" class="screen home on"><div class="hero"><div class="brand"><h1>BADAAM<br>SAAT</h1><p>Cards. Chai. Good company.</p></div><div class="homeActions"><div class="modePick"><button class="mode on" data-mode="quick">Quick Game</button><button class="mode" data-mode="seven">7 Rounds</button></div><button id="playHome" class="bigbtn">▶ PLAY</button><button id="chooseHome" class="bigbtn secondary">👥 CHOOSE OPPONENTS</button><div class="tinyrow"><button type="button">Rules</button><button type="button">Settings</button><button type="button">Stats</button></div></div></div></section>
<section id="choose" class="screen"><div class="top"><button class="iconbtn" id="backHome">‹</button><h2>Choose Opponents</h2><span style="width:44px"></span></div><div class="choose"><p>Pick 3 people for the table. Their skill changes how they play.</p><div class="roster" id="roster"></div></div><div class="startbar"><button id="startGame">Start Game · 3 selected</button></div></section>
<section id="game" class="screen game"><div class="table"><div class="gameTop"><button id="exitGame">☰</button><div id="round" class="round">Quick Game</div><button id="scores">Scores</button></div><i class="prop chai"></i><i class="prop snack"></i><div id="seat2" class="seat north"></div><div id="seat1" class="seat west"></div><div id="seat3" class="seat east"></div><div id="board" class="board"></div><div id="toast" class="toast">Shuffling…</div><div id="you" class="you">You · 13 cards</div><div id="hand" class="hand"></div><button id="pass" class="pass" disabled>Pass</button><div id="scoreOverlay" class="scoreOverlay"><button id="closeScore" class="close">Close</button><h3>Scores</h3><div id="scoreBody"></div></div></div></section>
</main>
<script>
(()=>{const people=[{name:"Vikram",stars:2,trait:"Casual. Makes obvious moves.",style:"casual",img:"assets/vikram.jpg"},{name:"Naina",stars:3,trait:"Cautious and patient.",style:"shed",img:"assets/naina.jpg"},{name:"Kabir",stars:3,trait:"Balanced all-round player.",style:"balanced",img:"assets/kabir.jpg"},{name:"Tara",stars:4,trait:"Defensive and tactical.",style:"block",img:"assets/tara.jpg"},{name:"Arjun",stars:5,trait:"Expert. Plans ahead.",style:"expert",img:"assets/arjun.jpg"},{name:"Leela",stars:2,trait:"Unpredictable. Opens suits.",style:"open",img:"assets/leela.jpg"}];
let selected=[0,1,2],mode="quick",players=[],round=0,hands=[[],[],[],[]],bounds={},turn=0,active=false,busy=false,scores=[0,0,0,0],history=[],selectedCard=null;
const suits=[{k:"H",s:"♥",red:1},{k:"D",s:"♦",red:1},{k:"C",s:"♣",red:0},{k:"S",s:"♠",red:0}],q=s=>document.querySelector(s),rn=r=>r===1?"A":r===11?"J":r===12?"Q":r===13?"K":String(r);
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));q("#"+id).classList.add("on")}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("on",x===b))});
function roster(){q("#roster").innerHTML="";people.forEach((p,i)=>{let b=document.createElement("button");b.className="person "+(selected.includes(i)?"sel":"");b.innerHTML=`<span class="tick">✓</span><img src="${p.img}" alt="${p.name}"><div class="meta"><b>${p.name}</b><div class="stars">${"★".repeat(p.stars)}${"☆".repeat(5-p.stars)}</div><div class="trait">${p.trait}</div></div>`;b.onclick=()=>{if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<3)selected.push(i);roster();q("#startGame").textContent=`Start Game · ${selected.length} selected`};q("#roster").appendChild(b)})}
q("#chooseHome").onclick=()=>show("choose");q("#playHome").onclick=()=>show("choose");q("#backHome").onclick=()=>show("home");q("#exitGame").onclick=()=>show("home");
function deck(){return suits.flatMap(s=>Array.from({length:13},(_,i)=>({s:s.k,sym:s.s,red:s.red,r:i+1})))}
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function legal(c){let b=bounds[c.s];return b?c.r===b.lo-1||c.r===b.hi+1:c.r===7}
function opts(p){return hands[p].filter(legal)}
function choose(p){let o=opts(p);if(!o.length)return null;let st=players[p].style;if(st==="casual")return o[Math.floor(Math.random()*o.length)];return o.slice().sort((a,b)=>score(b)-score(a))[0];function score(c){let opened=!!bounds[c.s],v=c.r;if(st==="shed")return v+(opened?4:0);if(st==="open")return (!opened?15:0)+v;if(st==="block")return v+(opened?10:-5);if(st==="expert")return v+(opened?13:-8)+(c.r>=11?5:0);return v+(opened?7:0)}}
function play(p,c){selectedCard=null;let i=hands[p].indexOf(c);if(i<0||!legal(c))return;hands[p].splice(i,1);if(!bounds[c.s])bounds[c.s]={lo:7,hi:7};else if(c.r<bounds[c.s].lo)bounds[c.s].lo=c.r;else bounds[c.s].hi=c.r;render();if(!hands[p].length){finish(p);return}turn=(p+1)%4;setTimeout(next,360)}
function next(){if(!active||busy)return;render();let o=opts(turn);if(turn===0){q("#toast").textContent=o.length?"Your turn":"No legal card · pass";q("#pass").disabled=o.length>0;return}busy=true;let p=turn;setTimeout(()=>{if(!active){busy=false;return}let c=choose(p);if(c){q("#toast").textContent=`${players[p].name} · ${rn(c.r)}${c.sym}`;busy=false;play(p,c)}else{q("#toast").textContent=`${players[p].name} passes`;turn=(p+1)%4;busy=false;render();setTimeout(next,330)}},500)}
function start(){round++;bounds={};hands=[[],[],[],[]];shuffle(deck()).forEach((c,i)=>hands[i%4].push(c));hands.forEach(h=>h.sort((a,b)=>a.s.localeCompare(b.s)||a.r-b.r));let s=hands.findIndex(h=>h.some(c=>c.s==="H"&&c.r===7));turn=s;active=true;busy=false;q("#round").textContent=mode==="seven"?`Round ${round} of 7`:"Quick Game";render();q("#toast").textContent=`${players[s].name} has ♥7 · BADAAM SAAT!`;setTimeout(()=>play(s,hands[s].find(c=>c.s==="H"&&c.r===7)),650)}
function finish(w){active=false;let pts=hands.map((h,i)=>i===w?0:h.reduce((n,c)=>n+c.r,0));scores=scores.map((x,i)=>x+pts[i]);history.push(pts);scoreboard();if(mode==="seven"&&round<7){q("#toast").textContent=`${players[w].name} wins · tap for round ${round+1}`;q("#toast").onclick=()=>{q("#toast").onclick=null;start()}}else{q("#toast").textContent=`${players[w].name} wins!`;q("#toast").onclick=null}}
function renderBoard(){q("#board").innerHTML="";suits.forEach(s=>{let lane=document.createElement("div");lane.className="lane";let b=bounds[s.k];let cards="";if(b){for(let r=b.lo;r<=b.hi;r++){let delta=r-7;let y=delta*22;cards+=`<div class="mini ${s.red?"red":""} ${r===7?"seven":""}" style="--y:${y}px;--r:${delta*0.35}deg;z-index:${20+r}">${rn(r)}${s.s}</div>`}}else cards='<div class="ghost">7</div>';lane.innerHTML=`<div class="suit ${s.red?"red":""}">${s.s}</div><div class="stack">${cards}</div>`;q("#board").appendChild(lane)})}
function renderHand(){let el=q("#hand");el.innerHTML="";let n=hands[0].length;let spread=Math.min(230,Math.max(150,n*19));hands[0].forEach((c,i)=>{let b=document.createElement("button");let playable=active&&turn===0&&legal(c);b.className=`card ${c.red?"red":""} ${playable?"playable":""} ${selectedCard===c?"selected":""}`;b.disabled=!playable;let t=n<=1?0:(i/(n-1)-.5),x=t*spread,rot=t*18,y=Math.abs(t)*12+(selectedCard===c?-15:playable?-5:0);b.style.transform=`translateX(calc(-50% + ${x}px)) translateY(${y}px) rotate(${rot}deg)`;b.style.zIndex=String(20+i);b.innerHTML=`${rn(c.r)}${c.sym}<span class="big">${c.sym}</span>`;b.onclick=()=>{if(selectedCard===c)play(0,c);else{selectedCard=c;renderHand();q("#toast").textContent=`${rn(c.r)}${c.sym} · tap again to play`}};el.appendChild(b)})}
function render(){renderBoard();renderHand();q("#you").textContent=`You · ${hands[0].length} cards`;[1,2,3].forEach(p=>{let n=hands[p].length;q("#seat"+p).innerHTML=`<img src="${players[p].img}" alt="${players[p].name}"><b>${players[p].name}</b><span>${n} cards</span><div class="backs">${Array.from({length:Math.min(n,6)},()=>'<i class="back"></i>').join("")}</div>`});if(turn!==0)q("#pass").disabled=true}
function scoreboard(){q("#scoreBody").innerHTML=`<table><tr><th>Player</th>${history.map((_,i)=>`<th>R${i+1}</th>`).join("")}<th>Total</th></tr>${players.map((p,i)=>`<tr><td>${p.name}</td>${history.map(r=>`<td>${r[i]}</td>`).join("")}<td><b>${scores[i]}</b></td></tr>`).join("")}</table>`}
q("#startGame").onclick=()=>{if(selected.length!==3)return;players=[{name:"You",style:"human",img:""},...selected.map(i=>people[i])];round=0;scores=[0,0,0,0];history=[];show("game");start()};
q("#pass").onclick=()=>{if(turn!==0||opts(0).length)return;turn=1;render();next()};q("#scores").onclick=()=>q("#scoreOverlay").classList.add("on");q("#closeScore").onclick=()=>q("#scoreOverlay").classList.remove("on");roster()})();
</script></body></html>
