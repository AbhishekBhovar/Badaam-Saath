<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#140d08'><title>Badaam Saat</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#100a07;color:#f7ead4;font-family:ui-rounded,'SF Pro Rounded','Avenir Next',system-ui,sans-serif}button{font:inherit}.app{max-width:760px;margin:auto;min-height:100dvh;background:#120b07}.screen{display:none;min-height:100dvh}.screen.on{display:block}.home{position:relative;overflow:hidden;background:#120b07}.hero{height:100dvh;min-height:690px;background:linear-gradient(180deg,transparent 45%,#120b07 79%),url('assets/home.jpg') center 18%/cover no-repeat;position:relative}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0004,transparent 25% 75%,#0004);pointer-events:none}.brand{position:absolute;left:7%;right:7%;top:12%;z-index:2;text-align:left}.brand h1{font-family:Georgia,serif;font-style:italic;font-size:clamp(50px,15vw,86px);line-height:.78;margin:0;letter-spacing:-4px;text-shadow:0 4px 20px #000}.brand p{margin:20px 0 0;font-size:16px;text-shadow:0 2px 8px #000}.homeActions{position:absolute;left:5%;right:5%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:3;display:grid;gap:10px}.bigbtn{border:1px solid #e2a84e;border-radius:16px;background:linear-gradient(#c84c34,#9f2d24);color:#fff1d8;padding:17px;font-weight:900;font-size:19px;box-shadow:0 8px 25px #0008,inset 0 0 0 2px #ffbf5740}.secondary{background:#17100bdc}.tinyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tinyrow button{border:1px solid #6e5139;background:#17100bdd;color:#ead7b9;border-radius:13px;padding:11px 6px;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:#130d09;position:sticky;top:0;z-index:20}.top h2{margin:0;font-size:20px}.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid #5e422d;background:#1e140d;color:#f1d7aa;font-size:20px}.choose{padding:0 12px 22px;background:linear-gradient(#130d09,#0d0906)}.choose p{margin:0 0 13px;color:#bca78d;font-size:13px}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.person{border:1px solid #59412d;background:#1b120d;border-radius:14px;padding:0;overflow:hidden;text-align:left;color:#f5e7d1;position:relative}.person.sel{border-color:#e6ad4c;box-shadow:0 0 0 2px #e6ad4c33}.person img{display:block;width:100%;aspect-ratio:1/1.05;object-fit:cover;object-position:center top}.person .meta{padding:9px}.person b{font-size:15px}.stars{color:#eab24c;font-size:11px;margin-top:2px}.trait{font-size:10px;color:#c7b39a;line-height:1.25;margin-top:4px;min-height:25px}.tick{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e2aa4a;color:#1c1109;font-weight:900;opacity:0}.sel .tick{opacity:1}.startbar{position:sticky;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0d0906 25%)}.startbar button{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(#efc568,#d99c32);font-weight:900;color:#2b180a;font-size:16px}
.game{background:#120b07}.gameTop{position:absolute;z-index:30;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}.gameTop button{border:1px solid #8d663f;background:#17100bdc;color:#f6e2bd;border-radius:13px;padding:10px 12px;font-weight:800}.round{background:#17100bcf;border:1px solid #6b4b31;border-radius:999px;padding:8px 12px;font-weight:900;font-size:12px}.table{height:100dvh;min-height:690px;position:relative;overflow:hidden;background:linear-gradient(#0002,#0000 18%,#0000 76%,#0008),url('assets/table.jpg') center/cover no-repeat}.table:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 70px #0008;pointer-events:none}.propChai{position:absolute;left:12px;top:100px;width:58px;height:88px;border-radius:7px 7px 18px 18px;border:4px solid #ead8b599;background:linear-gradient(90deg,#fff2,#8d4a1dcc,#fff2);box-shadow:8px 10px 16px #0006;z-index:2}.propChai:before{content:'';position:absolute;left:5px;right:5px;top:8px;height:8px;background:#6e3515;border-radius:50%}.chips{position:absolute;right:-16px;top:100px;width:116px;height:94px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7b82e 0 9%,#d96f16 10% 20%,#f4a426 21% 29%,#b65b16 30% 38%,#ed9720 39% 50%,#3a1b0d 52%);border:5px solid #4b2717;box-shadow:0 10px 18px #0007;z-index:2}.seat{position:absolute;z-index:8;text-align:center;font-size:11px;text-shadow:0 2px 5px #000}.seat img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #dba84c;box-shadow:0 5px 14px #0008}.seat b{display:block;font-size:12px;margin-top:2px}.north{top:65px;left:50%;transform:translateX(-50%)}.west{left:8px;top:37%}.east{right:8px;top:37%}.backs{display:flex;justify-content:center;margin-top:3px}.back{width:17px;height:26px;border-radius:3px;margin-left:-7px;background:repeating-linear-gradient(45deg,#a92d34 0 3px,#e56862 3px 6px);border:1px solid #f3c2a5}.board{position:absolute;left:14%;right:14%;top:25%;bottom:25%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:5;align-items:center}.lane{display:flex;flex-direction:column;align-items:center;gap:2px}.suit{font-size:21px;font-weight:900;text-shadow:0 2px 4px #fff3}.red{color:#c9303a}.mini{width:40px;height:28px;border-radius:5px;background:#fffdf7;color:#21140e;border:1px solid #d7c6ad;display:grid;place-items:center;font-weight:900;font-size:12px;box-shadow:0 3px 5px #0006;transform:rotate(var(--r))}.mini.red{color:#c9303a}.mini.seven{box-shadow:0 0 0 3px #e5ad3f,0 4px 8px #0008}.ghost{width:38px;height:28px;border:1px dashed #d6b88c99;border-radius:6px;display:grid;place-items:center;color:#f3d9ad88}.toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:12;background:#17100de8;border:1px solid #8d6843;color:#f7e6ca;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;white-space:nowrap}.you{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:12;font-size:11px;background:#17100dcf;border:1px solid #7b5b3d;border-radius:999px;padding:5px 10px}.hand{position:absolute;left:0;right:0;bottom:-9px;height:102px;display:flex;justify-content:center;align-items:flex-end;z-index:10;padding:0 5px}.card{width:58px;height:92px;flex:0 0 58px;margin-left:-13px;border:1px solid #d4c4ad;border-radius:9px;background:linear-gradient(145deg,#fff,#f6efe4);box-shadow:0 6px 12px #0008;padding:6px;text-align:left;font-weight:900;font-size:14px;position:relative;color:#241711;transition:.14s}.card:first-child{margin-left:0}.card.red{color:#c9303a}.card.play{transform:translateY(-8px);box-shadow:0 0 0 3px #e9b347,0 8px 15px #0008}.card .big{position:absolute;right:6px;bottom:4px;font-size:23px}.pass{position:absolute;right:12px;bottom:82px;z-index:13;border:1px solid #805c3d;background:#17100de8;color:#f5dfbc;border-radius:12px;padding:9px 11px;font-weight:900}.pass:disabled{opacity:0;pointer-events:none}.scoreOverlay{display:none;position:absolute;inset:9% 6%;z-index:40;background:#120c08f5;border:1px solid #65482f;border-radius:20px;padding:14px;box-shadow:0 20px 60px #000}.scoreOverlay.on{display:block}.scoreOverlay table{width:100%;border-collapse:collapse;font-size:12px}.scoreOverlay th,.scoreOverlay td{padding:7px 3px;border-bottom:1px solid #4b3626;text-align:center}.scoreOverlay th:first-child,.scoreOverlay td:first-child{text-align:left}.close{float:right;border:0;border-radius:10px;padding:8px;background:#2c1d13;color:#f2dab5}
@media(max-width:390px){.roster{gap:7px}.person .meta{padding:7px}.table{min-height:640px}.board{left:12%;right:12%}.card{width:53px;flex-basis:53px;height:85px;margin-left:-14px}.seat img{width:48px;height:48px}.propChai{transform:scale(.88);transform-origin:top left}.chips{transform:scale(.85);transform-origin:top right}}@media(min-width:600px){.roster{grid-template-columns:repeat(3,1fr)}.board{left:23%;right:23%}.hand .card{width:65px;flex-basis:65px;margin-left:-9px}}
</style></head><body><main class='app'>
<section id='home' class='screen home on'><div class='hero'><div class='brand'><h1>BADAAM<br>SAAT</h1><p>Cards. Chai. Good company.</p></div><div class='homeActions'><button id='playHome' class='bigbtn'>▶ PLAY<div style='font-size:11px;font-weight:600;margin-top:3px'>Quick Game · 7 Rounds</div></button><button id='chooseHome' class='bigbtn secondary'>👥 CHOOSE OPPONENTS</button><div class='tinyrow'><button>Rules</button><button>Settings</button><button>Stats</button></div></div></div></section>
<section id='choose' class='screen'><div class='top'><button class='iconbtn' id='backHome'>‹</button><h2>Choose Opponents</h2><span style='width:44px'></span></div><div class='choose'><p>Pick 3 people for the table. Their skill changes how they play.</p><div class='roster' id='roster'></div></div><div class='startbar'><button id='startGame'>Start Game · 3 selected</button></div></section>
<section id='game' class='screen game'><div class='table'><div class='gameTop'><button id='exitGame'>☰</button><div id='round' class='round'>Quick Game</div><button id='scores'>Scores</button></div><div class='propChai'></div><div class='chips'></div><div id='seat2' class='seat north'></div><div id='seat1' class='seat west'></div><div id='seat3' class='seat east'></div><div id='board' class='board'></div><div id='toast' class='toast'>Shuffling…</div><div id='you' class='you'>You · 13 cards</div><div id='hand' class='hand'></div><button id='pass' class='pass' disabled>Pass</button><div id='scoreOverlay' class='scoreOverlay'><button id='closeScore' class='close'>Close</button><h3>Scores</h3><div id='scoreBody'></div></div></div></section>
</main><script>
(()=>{const people=[{name:'Vikram',stars:2,trait:'Casual. Makes obvious moves.',style:'casual',img:'assets/vikram.jpg'},{name:'Naina',stars:3,trait:'Cautious and patient.',style:'shed',img:'assets/naina.jpg'},{name:'Kabir',stars:3,trait:'Balanced all-round player.',style:'balanced',img:'assets/kabir.jpg'},{name:'Tara',stars:4,trait:'Defensive and tactical.',style:'block',img:'assets/tara.jpg'},{name:'Arjun',stars:5,trait:'Expert. Plans ahead.',style:'expert',img:'assets/arjun.jpg'},{name:'Leela',stars:2,trait:'Unpredictable. Opens suits.',style:'open',img:'assets/leela.jpg'}];let selected=[0,1,2],mode='quick',players=[],round=0,hands=[[],[],[],[]],bounds={},turn=0,active=false,busy=false,scores=[0,0,0,0],history=[];const suits=[{k:'H',s:'♥',red:1},{k:'D',s:'♦',red:1},{k:'C',s:'♣',red:0},{k:'S',s:'♠',red:0}],q=s=>document.querySelector(s),rn=r=>r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));q('#'+id).classList.add('on')}function roster(){q('#roster').innerHTML='';people.forEach((p,i)=>{let b=document.createElement('button');b.className='person '+(selected.includes(i)?'sel':'');b.innerHTML=`<span class='tick'>✓</span><img src='${p.img}' alt='Portrait of ${p.name}'><div class='meta'><b>${p.name}</b><div class='stars'>${'★'.repeat(p.stars)}${'☆'.repeat(5-p.stars)}</div><div class='trait'>${p.trait}</div></div>`;b.onclick=()=>{if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<3)selected.push(i);roster();q('#startGame').textContent=`Start Game · ${selected.length} selected`};q('#roster').appendChild(b)})}q('#chooseHome').onclick=()=>show('choose');q('#playHome').onclick=()=>show('choose');q('#backHome').onclick=()=>show('home');q('#exitGame').onclick=()=>show('home');function deck(){return suits.flatMap(s=>Array.from({length:13},(_,i)=>({s:s.k,sym:s.s,red:s.red,r:i+1})))}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function legal(c){let b=bounds[c.s];return b?c.r===b.lo-1||c.r===b.hi+1:c.r===7}function opts(p){return hands[p].filter(legal)}function choose(p){let o=opts(p);if(!o.length)return null;let st=players[p].style;if(st==='casual')return o[Math.floor(Math.random()*o.length)];return o.slice().sort((a,b)=>score(b)-score(a))[0];function score(c){let opened=!!bounds[c.s],v=c.r;if(st==='shed')return v+(opened?4:0);if(st==='open')return (!opened?15:0)+v;if(st==='block')return v+(opened?10:-5);if(st==='expert')return v+(opened?13:-8)+(c.r>=11?5:0);return v+(opened?7:0)}}function play(p,c){let i=hands[p].indexOf(c);if(i<0||!legal(c))return;hands[p].splice(i,1);if(!bounds[c.s])bounds[c.s]={lo:7,hi:7};else if(c.r<bounds[c.s].lo)bounds[c.s].lo=c.r;else bounds[c.s].hi=c.r;render();if(!hands[p].length){finish(p);return}turn=(p+1)%4;setTimeout(next,360)}function next(){if(!active||busy)return;render();let o=opts(turn);if(turn===0){q('#toast').textContent=o.length?'Your turn · play a glowing card':'Nothing fits · you must pass';q('#pass').disabled=o.length>0;return}busy=true;let p=turn;setTimeout(()=>{if(!active){busy=false;return}let c=choose(p);if(c){q('#toast').textContent=`${players[p].name} plays ${rn(c.r)}${c.sym}`;busy=false;play(p,c)}else{q('#toast').textContent=`${players[p].name} passes`;turn=(p+1)%4;busy=false;render();setTimeout(next,330)}},500)}function start(){round++;bounds={};hands=[[],[],[],[]];shuffle(deck()).forEach((c,i)=>hands[i%4].push(c));hands.forEach(h=>h.sort((a,b)=>a.s.localeCompare(b.s)||a.r-b.r));let s=hands.findIndex(h=>h.some(c=>c.s==='H'&&c.r===7));turn=s;active=true;busy=false;q('#round').textContent=mode==='seven'?`Round ${round} of 7`:'Quick Game';render();q('#toast').textContent=`${players[s].name} has ♥7 · BADAAM SAAT!`;setTimeout(()=>play(s,hands[s].find(c=>c.s==='H'&&c.r===7)),650)}function finish(w){active=false;let pts=hands.map((h,i)=>i===w?0:h.reduce((n,c)=>n+c.r,0));scores=scores.map((x,i)=>x+pts[i]);history.push(pts);scoreboard();q('#toast').textContent=`${players[w].name} wins!`;q('#toast').onclick=()=>{q('#toast').onclick=null;start()}}function render(){q('#board').innerHTML='';suits.forEach(s=>{let l=document.createElement('div');l.className='lane';let b=bounds[s.k],cards='';if(b)for(let r=b.lo;r<=b.hi;r++)cards+=`<div class='mini ${s.red?'red':''} ${r===7?'seven':''}' style='--r:${((r%3)-1)*1.4}deg'>${rn(r)}${s.s}</div>`;else cards='<div class=ghost>7</div>';l.innerHTML=`<div class='suit ${s.red?'red':''}'>${s.s}</div>${cards}`;q('#board').appendChild(l)});q('#hand').innerHTML='';hands[0].forEach(c=>{let b=document.createElement('button');b.className=`card ${c.red?'red':''} ${active&&turn===0&&legal(c)?'play':''}`;b.disabled=!(active&&turn===0&&legal(c));b.innerHTML=`${rn(c.r)}${c.sym}<span class=big>${c.sym}</span>`;b.onclick=()=>play(0,c);q('#hand').appendChild(b)});q('#you').textContent=`You · ${hands[0].length} cards`;[1,2,3].forEach(p=>{let n=hands[p].length;q('#seat'+p).innerHTML=`<img src='${players[p].img}' alt='${players[p].name}'><b>${players[p].name}</b><span>${n} cards</span><div class=backs>${Array.from({length:Math.min(n,6)},()=>'<i class=back></i>').join('')}</div>`});if(turn!==0)q('#pass').disabled=true}function scoreboard(){q('#scoreBody').innerHTML=`<table><tr><th>Player</th>${history.map((_,i)=>`<th>R${i+1}</th>`).join('')}<th>Total</th></tr>${players.map((p,i)=>`<tr><td>${p.name}</td>${history.map(r=>`<td>${r[i]}</td>`).join('')}<td><b>${scores[i]}</b></td></tr>`).join('')}</table>`}q('#startGame').onclick=()=>{if(selected.length!==3)return;players=[{name:'You',style:'human',img:''},...selected.map(i=>people[i])];show('game');start()};q('#pass').onclick=()=>{if(turn!==0||opts(0).length)return;turn=1;render();next()};q('#scores').onclick=()=>q('#scoreOverlay').classList.add('on');q('#closeScore').onclick=()=>q('#scoreOverlay').classList.remove('on');roster()})();
</script></body></html>
