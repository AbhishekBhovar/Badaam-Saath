<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8c48c"><title>Badaam Saat</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><section id="menu" class="screen menu"><div class="logo"><span>♥</span><h1>Badaam Saat</h1><p>Cards. Chai. Family chaos.</p></div><div class="menu-card"><button class="mode selected" data-mode="quick"><b>Quick Game</b><small>One round</small></button><button class="mode" data-mode="seven"><b>7-Round Match</b><small>Lowest score wins</small></button><button id="play" class="primary">Deal the cards</button><button id="rulesBtn" class="textbtn">How to play</button></div></section><section id="game" class="screen game hidden"><header><button id="home" aria-label="Home">‹</button><div><b id="roundLabel">Quick Game</b><small id="turnLabel">Getting the table ready…</small></div><button id="scoresBtn">Scores</button></header><div class="table-shell"><div class="table"><div class="grain"></div><div class="prop chai" aria-hidden="true"><i></i></div><div class="prop chips" aria-hidden="true"><b>MASALA</b><span>CHIPS</span></div><div class="prop coaster"></div><div id="north" class="player north"></div><div id="west" class="player west"></div><div id="east" class="player east"></div><div id="board" class="board"></div><div id="toast" class="toast">♥7 starts every round</div><div class="you"><b>You</b><span id="youCount"></span></div><div id="hand" class="hand"></div><button id="pass" class="pass" disabled>Pass</button></div></div></section><dialog id="modal"><div id="modalBody"></div><button id="closeModal" class="primary">Close</button></dialog></main><script src="game.js"></script></body></html>
