<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b07"><title>Badaam Saat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0d0805;color:#fff2db;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}button{font:inherit}.app{max-width:720px;margin:auto;min-height:100dvh}.screen{display:none;min-height:100dvh}.screen.on{display:block}
.home{height:100dvh;min-height:690px;position:relative;overflow:hidden;background:linear-gradient(180deg,#0002,#0000 45%,#0c0705 86%),url("assets/home.jpg") center/cover}.brand{position:absolute;left:28px;right:28px;top:22%;text-align:center;text-shadow:0 4px 20px #000}.brand h1{font:italic 900 clamp(50px,15vw,86px)/.8 Georgia,serif;margin:0;letter-spacing:-4px}.brand .spade{font-size:34px;color:#e8b345}.brand p{font-family:Georgia,serif;margin:4px 0}.homeControls{position:absolute;left:18px;right:18px;bottom:calc(17px + env(safe-area-inset-bottom));display:grid;gap:9px}.primary,.secondary{border-radius:15px;padding:15px;font-weight:900;font-size:18px}.primary{border:1px solid #ef6b4d;background:linear-gradient(#e43f35,#b92225);color:#fff}.secondary{border:1px solid #8b623c;background:#17100de8;color:#f8e6c9}.small{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.small button{border:1px solid #68482f;background:#17100ddd;color:#ead4b2;border-radius:11px;padding:9px 4px;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 13px 11px;background:#110a07}.top h2{margin:0;font-size:20px}.back{border:0;background:none;color:#fff;font-size:34px}.choose{padding:3px 13px 112px;background:linear-gradient(#110a07,#0b0705)}.choose>p{margin:0 0 12px;color:#bca78b;font-size:13px}.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.person{border:0;background:#18100b;color:white;border-radius:14px;overflow:hidden;text-align:left;padding:0;position:relative;box-shadow:0 8px 22px #0005}.person img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.meta{padding:9px}.meta b{font-size:16px}.stars{font-size:11px;color:#efb54b}.trait{font-size:10px;color:#c6b196;margin-top:3px;min-height:25px}.person.sel{box-shadow:0 0 0 2px #eeb64c,0 9px 25px #0007}.tick{position:absolute;right:8px;top:8px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#efbb52;color:#231408;font-weight:1000;opacity:0}.sel .tick{opacity:1}.start{position:fixed;left:max(14px,calc((100vw - 720px)/2 + 14px));right:max(14px,calc((100vw - 720px)/2 + 14px));bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:14px;padding:15px;background:linear-gradient(#ffd16d,#eaa62d);color:#261507;font-size:17px;font-weight:1000}
.table{height:100dvh;min-height:690px;position:relative;overflow:hidden;background:linear-gradient(#0005,#0000 16%,#0000 78%,#0008),url("assets/table.jpg") center/cover}.gameTop{position:absolute;z-index:30;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}.gameTop button,.round{border:1px solid #765135;background:#17100bdc;color:#f5e1c0;border-radius:12px;padding:9px 11px;font-weight:900}.round{border-radius:999px;font-size:12px}
.seat{position:absolute;z-index:10;text-align:center;font-size:11px;text-shadow:0 2px 5px #000}.seat img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #e4ac46;box-shadow:0 5px 14px #0008}.seat b{display:block;font-size:12px}.north{top:61px;left:50%;transform:translateX(-50%)}.west{left:7px;top:28%}.east{right:7px;top:28%}.backs{display:flex;justify-content:center;margin-top:3px}.cb{width:18px;height:28px;border-radius:3px;margin-left:-8px;background:repeating-linear-gradient(45deg,#a92e35 0 3px,#e66861 3px 6px);border:1px solid #f2c0a0}
.board{position:absolute;z-index:5;left:4%;right:4%;top:21%;bottom:25%;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.lane{display:flex;flex-direction:column;align-items:center;justify-content:center}.suit{font-size:24px;font-weight:1000;margin-bottom:3px}.red{color:#d33740}.stack{height:82%;width:100%;position:relative}.mini{position:absolute;left:50%;top:50%;width:clamp(57px,15.5vw,70px);aspect-ratio:.69;transform:translate(-50%,calc(-50% + var(--y))) rotate(var(--r));border-radius:8px;background:linear-gradient(145deg,#fff,#f4ecdf);border:1px solid #d2bfa6;box-shadow:0 7px 12px #0009;padding:6px;color:#21140e;font-size:14px;font-weight:1000}.mini.red{color:#cb3038}.mini.seven{box-shadow:0 8px 15px #0009,0 0 0 1px #eeb84d}.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(57px,15.5vw,70px);aspect-ratio:.69;border:1px dashed #f1d6a75c;border-radius:8px;display:grid;place-items:center;color:#f1d6a76b;font-weight:900}
.hand{position:absolute;z-index:14;left:0;right:0;bottom:-12px;height:130px;pointer-events:none}.card{position:absolute;left:50%;bottom:0;width:clamp(59px,16vw,71px);aspect-ratio:.69;border:1px solid #d2c0a7;border-radius:9px;background:linear-gradient(145deg,#fff,#f4ede2);box-shadow:0 8px 15px #0009;padding:6px;text-align:left;color:#21140e;font-size:15px;font-weight:1000;transform-origin:50% 120%;pointer-events:auto;transition:.15s}.card.red{color:#ca3038}.card.playable{filter:brightness(1.08) drop-shadow(0 0 5px #f1c05e99)}.card.selected{filter:brightness(1.13) drop-shadow(0 0 9px #f1c05ecc)}.big{position:absolute;right:6px;bottom:5px;font-size:25px}.toast{position:absolute;z-index:16;left:50%;bottom:128px;transform:translateX(-50%);background:#17100ddd;border:1px solid #795438;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;white-space:nowrap}.pass{position:absolute;right:10px;bottom:107px;z-index:17;border:1px solid #745036;background:#17100ddd;color:#f3ddb9;border-radius:10px;padding:8px 10px;font-weight:900}.pass:disabled{opacity:0;pointer-events:none}.score{display:none;position:absolute;z-index:50;inset:10% 6%;background:#120c08f7;border-radius:20px;padding:15px;box-shadow:0 20px 60px #000}.score.on{display:block}.score table{width:100%;border-collapse:collapse;font-size:12px}.score td,.score th{padding:7px 3px;border-bottom:1px solid #4a3525;text-align:center}.score td:first-child,.score th:first-child{text-align:left}.close{float:right;border:0;border-radius:9px;padding:8px;background:#2a1c13;color:white}
@media(max-width:390px){.roster{gap:8px}.mini,.ghost{width:54px}.card{width:56px}.seat img{width:48px;height:48px}}
</style></head><body><main class="app">
<section id="home" class="screen on"><div class="home"><div class="brand"><h1>BADAAM<br>SAAT</h1><div class="spade">♠</div><p>Cards. Chai. Good Company.</p></div><div class="homeControls"><button id="play" class="primary">▶ PLAY</button><button id="opp" class="secondary">👥 CHOOSE OPPONENTS</button><div class="small"><button>Rules</button><button>Settings</button><button>Stats</button></div></div></div></section>
<section id="choose" class="screen"><div class="top"><button id="back" class="back">‹</button><h2>Choose Opponents</h2><span></span></div><div class="choose"><p>Pick 3 opponents. Their skill and personality change how they play.</p><div id="roster" class="roster"></div></div><button id="start" class="start">Start Game · 3 selected</button></section>
<section id="game" class="screen"><div class="table"><div class="gameTop"><button id="menu">☰</button><div class="round">Quick Game</div><button id="scores">Scores</button></div><div id="seat2" class="seat north"></div><div id="seat1" class="seat west"></div><div id="seat3" class="seat east"></div><div id="board" class="board"></div><div id="toast" class="toast">Shuffling…</div><div id="hand" class="hand"></div><button id="pass" class="pass" disabled>Pass</button><div id="score" class="score"><button id="close" class="close">Close</button><h3>Scores</h3><div id="scoreBody"></div></div></div></section>
</main><script>
(()=>{const P=[{name:"Vikram",stars:3,trait:"Aggressive. Puts pressure.",style:"block",img:"assets/vikram.jpg"},{name:"Leela",stars:3,trait:"Unpredictable. Opens suits.",style:"open",img:"assets/leela.jpg"},{name:"Kabir",stars:3,trait:"Plays it safe. Hard to read.",style:"balanced",img:"assets/kabir.jpg"},{name:"Arjun",stars:5,trait:"Expert. Plans ahead.",style:"expert",img:"assets/arjun.jpg"},{name:"Naina",stars:3,trait:"Patient. Sheds danger.",style:"shed",img:"assets/naina.jpg"},{name:"Tara",stars:4,trait:"Defensive. Preserves blockers.",style:"block",img:"assets/tara.jpg"}],S=[{k:"H",s:"♥",r:1},{k:"D",s:"♦",r:1},{k:"C",s:"♣",r:0},{k:"S",s:"♠",r:0}];let sel=[0,1,3],players=[],hands=[[],[],[],[]],bounds={},turn=0,active=false,busy=false,pick=null,scores=[0,0,0,0];const q=x=>document.querySelector(x),rn=n=>n==1?"A":n==11?"J":n==12?"Q":n==13?"K":n;function show(x){document.querySelectorAll(".screen").forEach(e=>e.classList.remove("on"));q("#"+x).classList.add("on")}function roster(){q("#roster").innerHTML="";P.forEach((p,i)=>{let b=document.createElement("button");b.className="person "+(sel.includes(i)?"sel":"");b.innerHTML=`<span class="tick">✓</span><img src="${p.img}" alt=""><div class="meta"><b>${p.name}</b><div class="stars">${"★".repeat(p.stars)}${"☆".repeat(5-p.stars)}</div><div class="trait">${p.trait}</div></div>`;b.onclick=()=>{if(sel.includes(i))sel=sel.filter(x=>x!=i);else if(sel.length<3)sel.push(i);roster()};q("#roster").appendChild(b)});q("#start").textContent=`Start Game · ${sel.length} selected`}function deck(){return S.flatMap(s=>Array.from({length:13},(_,i)=>({s:s.k,sym:s.s,red:s.r,r:i+1})))}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function legal(c){let b=bounds[c.s];return b?c.r==b.lo-1||c.r==b.hi+1:c.r==7}function opts(p){return hands[p].filter(legal)}function ai(p){let o=opts(p);if(!o.length)return null,st=players[p].style;if(st=="open")return o.sort((a,b)=>(!bounds[b.s])-(!bounds[a.s])||b.r-a.r)[0];if(st=="expert"||st=="block")return o.sort((a,b)=>(!!bounds[b.s])-(!!bounds[a.s])||b.r-a.r)[0];return o.sort((a,b)=>b.r-a.r)[0]}function playCard(p,c){pick=null;let i=hands[p].indexOf(c);if(i<0||!legal(c))return;hands[p].splice(i,1);if(!bounds[c.s])bounds[c.s]={lo:7,hi:7};else c.r<bounds[c.s].lo?bounds[c.s].lo=c.r:bounds[c.s].hi=c.r;render();if(!hands[p].length)return finish(p);turn=(p+1)%4;setTimeout(next,330)}function next(){if(!active||busy)return;render();let o=opts(turn);if(turn==0){q("#toast").textContent=o.length?"Your turn · play a glowing card":"No legal card · pass";q("#pass").disabled=!!o.length;return}busy=true;let p=turn;setTimeout(()=>{let c=ai(p);if(c){q("#toast").textContent=`${players[p].name} played ${rn(c.r)}${c.sym}`;busy=false;playCard(p,c)}else{q("#toast").textContent=`${players[p].name} passes`;turn=(p+1)%4;busy=false;render();setTimeout(next,300)}},480)}function deal(){bounds={};hands=[[],[],[],[]];shuffle(deck()).forEach((c,i)=>hands[i%4].push(c));hands.forEach(h=>h.sort((a,b)=>a.s.localeCompare(b.s)||a.r-b.r));let st=hands.findIndex(h=>h.some(c=>c.s=="H"&&c.r==7));turn=st;active=true;render();q("#toast").textContent=`${players[st].name} has ♥7 · BADAAM SAAT!`;setTimeout(()=>playCard(st,hands[st].find(c=>c.s=="H"&&c.r==7)),600)}function finish(w){active=false;let pts=hands.map((h,i)=>i==w?0:h.reduce((n,c)=>n+c.r,0));scores=scores.map((x,i)=>x+pts[i]);scoreboard();q("#toast").textContent=`${players[w].name} wins!`}function board(){q("#board").innerHTML="";S.forEach(s=>{let l=document.createElement("div");l.className="lane";let b=bounds[s.k],cards="";if(b)for(let r=b.lo;r<=b.hi;r++){let d=r-7;cards+=`<div class="mini ${s.r?"red":""} ${r==7?"seven":""}" style="--y:${d*25}px;--r:${d*.35}deg;z-index:${20+r}">${rn(r)}${s.s}</div>`}else cards='<div class="ghost">7</div>';l.innerHTML=`<div class="suit ${s.r?"red":""}">${s.s}</div><div class="stack">${cards}</div>`;q("#board").appendChild(l)})}function hand(){let e=q("#hand");e.innerHTML="";let n=hands[0].length,spread=Math.min(250,Math.max(160,n*20));hands[0].forEach((c,i)=>{let b=document.createElement("button"),ok=active&&turn==0&&legal(c),t=n<2?0:i/(n-1)-.5,x=t*spread,rot=t*20,y=Math.abs(t)*13+(pick===c?-17:ok?-5:0);b.className=`card ${c.red?"red":""} ${ok?"playable":""} ${pick===c?"selected":""}`;b.disabled=!ok;b.style.transform=`translateX(calc(-50% + ${x}px)) translateY(${y}px) rotate(${rot}deg)`;b.style.zIndex=20+i;b.innerHTML=`${rn(c.r)}${c.sym}<span class="big">${c.sym}</span>`;b.onclick=()=>{if(pick===c)playCard(0,c);else{pick=c;hand();q("#toast").textContent=`${rn(c.r)}${c.sym} · tap again to play`}};e.appendChild(b)})}function render(){board();hand();[1,2,3].forEach(p=>q("#seat"+p).innerHTML=`<img src="${players[p].img}" alt=""><b>${players[p].name}</b><span>${hands[p].length} cards</span><div class="backs">${Array.from({length:Math.min(7,hands[p].length)},()=>'<i class="cb"></i>').join("")}</div>`);if(turn!=0)q("#pass").disabled=true}function scoreboard(){q("#scoreBody").innerHTML=`<table><tr><th>Player</th><th>Total</th></tr>${players.map((p,i)=>`<tr><td>${p.name}</td><td>${scores[i]}</td></tr>`).join("")}</table>`}q("#play").onclick=q("#opp").onclick=()=>show("choose");q("#back").onclick=q("#menu").onclick=()=>show("home");q("#start").onclick=()=>{if(sel.length!=3)return;players=[{name:"You",style:"human",img:""},...sel.map(i=>P[i])];show("game");deal()};q("#pass").onclick=()=>{if(turn||opts(0).length)return;turn=1;render();next()};q("#scores").onclick=()=>q("#score").classList.add("on");q("#close").onclick=()=>q("#score").classList.remove("on");roster()})();
</script></body></html>
