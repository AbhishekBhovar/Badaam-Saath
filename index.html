<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100906"><title>Badaam Saat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0e0805;color:#fff4df;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}button{font:inherit}.app{max-width:720px;margin:auto;min-height:100dvh}.screen{display:none;min-height:100dvh}.screen.on{display:block}
.home{position:relative;background:#120a06;overflow:hidden}.homeArt{height:100dvh;min-height:690px;background:linear-gradient(180deg,transparent 0 55%,#0e0805 79%),url("assets/home-reference.jpg") 50% 0/cover no-repeat;position:relative}.homeControls{position:absolute;z-index:3;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px}.primary,.secondary{border-radius:16px;padding:15px;border:1px solid #e4a33d;font-weight:900;font-size:18px}.primary{background:linear-gradient(#d94b35,#b72f29);color:#fff3d9}.secondary{background:#17100de8;color:#fff0d4}.smallrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.smallrow button{border:1px solid #705036;background:#17100ddd;color:#e8d2ae;border-radius:12px;padding:10px 5px;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(13px + env(safe-area-inset-top)) 14px 12px;background:#120b07}.top h2{margin:0;font-size:20px}.back{border:0;background:none;color:white;font-size:34px}.choose{padding:4px 13px 120px;background:linear-gradient(#120b07,#0c0806)}.choose p{color:#bca98d;margin:0 0 12px;font-size:13px}.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.person{position:relative;padding:0;border:0;background:#18100b;border-radius:14px;overflow:hidden;text-align:left;color:white;box-shadow:0 8px 22px #0005}.person img{width:100%;aspect-ratio:1/.92;display:block;object-fit:cover}.person .meta{padding:10px}.person b{font-size:17px}.stars{color:#f2b847;font-size:12px}.trait{font-size:11px;color:#c7b49a;margin-top:4px}.person.sel{box-shadow:0 0 0 2px #efb94f,0 10px 25px #0007}.tick{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#efbd58;color:#26170a;font-weight:1000;opacity:0}.sel .tick{opacity:1}.start{position:fixed;left:max(14px,calc((100vw - 720px)/2 + 14px));right:max(14px,calc((100vw - 720px)/2 + 14px));bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;border:0;border-radius:15px;padding:15px;background:linear-gradient(#ffd06b,#eaa72e);font-weight:1000;color:#251507;font-size:17px}
.table{height:100dvh;min-height:690px;position:relative;overflow:hidden;background:linear-gradient(#0005,#0000 18%,#0000 76%,#0007),url("assets/timber-clean.jpg") center/cover no-repeat}.table:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 80px #0007;pointer-events:none}.gameTop{position:absolute;z-index:30;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}.gameTop button,.round{border:1px solid #7e5939;background:#17100bd9;color:#f7e4c4;border-radius:13px;padding:9px 11px;font-weight:900;backdrop-filter:blur(8px)}.round{border-radius:999px;font-size:12px}
.chai{position:absolute;left:-12px;top:100px;width:67px;height:90px;border:4px solid #ead5aa88;border-radius:8px 8px 18px 18px;background:linear-gradient(90deg,#fff2,#7e3d17cc,#fff2);z-index:2;opacity:.72}.chai:before{content:"";position:absolute;left:5px;right:5px;top:9px;height:8px;background:#6e3212;border-radius:50%}.snack{position:absolute;right:-28px;top:88px;width:105px;height:76px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#dc8c25 0 7%,#7b3816 8% 15%,#e5a13b 16% 25%,#6e3114 26% 33%,#bd6e20 34% 45%,#392014 48%);border:5px solid #5a321e;z-index:2;opacity:.78}
.seat{position:absolute;z-index:9;text-align:center;font-size:11px;text-shadow:0 2px 5px #000}.seat img{width:55px;height:55px;border-radius:50%;object-fit:cover;border:2px solid #e5ad45;box-shadow:0 5px 14px #0008}.seat b{display:block;font-size:12px}.north{top:62px;left:50%;transform:translateX(-50%)}.west{left:7px;top:31%}.east{right:7px;top:31%}.backs{display:flex;justify-content:center;margin-top:3px}.cb{width:18px;height:29px;border-radius:3px;margin-left:-8px;background:repeating-linear-gradient(45deg,#b72e36 0 3px,#e96862 3px 6px);border:1px solid #f5c8a9}
.board{position:absolute;left:5%;right:5%;top:22%;bottom:24%;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.lane{display:flex;flex-direction:column;align-items:center;justify-content:center}.suit{font-size:23px;font-weight:1000;margin-bottom:3px}.red{color:#d63a43}.stack{height:82%;width:100%;position:relative}.mini{position:absolute;left:50%;top:50%;width:clamp(55px,15vw,68px);aspect-ratio:.69;transform:translate(-50%,calc(-50% + var(--y))) rotate(var(--r));border-radius:8px;background:linear-gradient(145deg,#fff,#f3ebdf);border:1px solid #d4c1a8;box-shadow:0 7px 12px #0008;padding:6px;color:#20140e;font-size:14px;font-weight:1000}.mini.red{color:#ce3039}.mini.seven{box-shadow:0 8px 14px #0009,0 0 0 1px #efbd55}.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(55px,15vw,68px);aspect-ratio:.69;border:1px dashed #ead1a166;border-radius:8px;display:grid;place-items:center;color:#f0d7a277;font-weight:900}
.hand{position:absolute;left:0;right:0;bottom:-13px;height:128px;z-index:12;pointer-events:none}.card{position:absolute;left:50%;bottom:0;width:clamp(58px,16vw,70px);aspect-ratio:.69;border:1px solid #d3c1a9;border-radius:9px;background:linear-gradient(145deg,#fff,#f4ede2);box-shadow:0 8px 15px #0009;padding:6px;text-align:left;color:#20140e;font-size:15px;font-weight:1000;transform-origin:50% 120%;pointer-events:auto;transition:.15s}.card.red{color:#ce3039}.card.playable{filter:brightness(1.08) drop-shadow(0 0 5px #f3c35b88)}.card.selected{filter:brightness(1.12) drop-shadow(0 0 9px #f3c35bcc)}.big{position:absolute;right:6px;bottom:5px;font-size:25px}.toast{position:absolute;z-index:15;left:50%;bottom:125px;transform:translateX(-50%);background:#17100dd8;border:1px solid #85603d;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;white-space:nowrap}.pass{position:absolute;right:10px;bottom:105px;z-index:16;border:1px solid #755235;background:#17100ddd;color:#f4dfbc;border-radius:11px;padding:8px 10px;font-weight:900}.pass:disabled{opacity:0;pointer-events:none}.score{display:none;position:absolute;z-index:50;inset:10% 6%;background:#120c08f5;border-radius:20px;padding:15px;box-shadow:0 20px 60px #000}.score.on{display:block}.score table{width:100%;border-collapse:collapse;font-size:12px}.score td,.score th{padding:7px 3px;border-bottom:1px solid #4a3525;text-align:center}.score td:first-child,.score th:first-child{text-align:left}.close{float:right;border:0;border-radius:9px;padding:8px;background:#2a1c13;color:white}
@media(max-width:390px){.roster{gap:8px}.board{left:4%;right:4%;gap:2px}.mini,.ghost{width:54px}.card{width:56px}.seat img{width:48px;height:48px}}
</style></head><body><main class="app">
<section id="home" class="screen home on"><div class="homeArt"><div class="homeControls"><button id="play" class="primary">▶ PLAY</button><button id="opponents" class="secondary">👥 CHOOSE OPPONENTS</button><div class="smallrow"><button>Rules</button><button>Settings</button><button>Stats</button></div></div></div></section>
<section id="choose" class="screen"><div class="top"><button id="back" class="back">‹</button><h2>Choose Opponents</h2><span></span></div><div class="choose"><p>Pick 3 opponents. Their skill and personality change how they play.</p><div id="roster" class="roster"></div></div><button id="start" class="start">Start Game · 3 selected</button></section>
<section id="game" class="screen"><div class="table"><div class="gameTop"><button id="menu">☰</button><div id="round" class="round">Quick Game</div><button id="scores">Scores</button></div><i class="chai"></i><i class="snack"></i><div id="seat2" class="seat north"></div><div id="seat1" class="seat west"></div><div id="seat3" class="seat east"></div><div id="board" class="board"></div><div id="toast" class="toast">Shuffling…</div><div id="hand" class="hand"></div><button id="pass" class="pass" disabled>Pass</button><div id="score" class="score"><button id="close" class="close">Close</button><h3>Scores</h3><div id="scoreBody"></div></div></div></section>
</main><script>
(()=>{const P=[{name:"Vikram",stars:4,trait:"Aggressive. Puts pressure.",style:"block",img:"assets/vikram.jpg"},{name:"Leela",stars:3,trait:"Unpredictable. Opens suits.",style:"open",img:"assets/leela.jpg"},{name:"Kabir",stars:4,trait:"Plays it safe. Hard to read.",style:"balanced",img:"assets/kabir.jpg"},{name:"Arjun",stars:5,trait:"Expert. Plans ahead.",style:"expert",img:"assets/arjun.jpg"},{name:"Naina",stars:3,trait:"Patient. Sheds danger.",style:"shed",img:"assets/naina.jpg"},{name:"Tara",stars:4,trait:"Defensive. Preserves blockers.",style:"block",img:"assets/tara.jpg"}],S=[{k:"H",s:"♥",r:1},{k:"D",s:"♦",r:1},{k:"C",s:"♣",r:0},{k:"S",s:"♠",r:0}];let sel=[0,1,3],players=[],hands=[[],[],[],[]],bounds={},turn=0,active=false,busy=false,selected=null,scores=[0,0,0,0],hist=[];const q=x=>document.querySelector(x),rn=n=>n==1?"A":n==11?"J":n==12?"Q":n==13?"K":n;function show(x){document.querySelectorAll(".screen").forEach(e=>e.classList.remove("on"));q("#"+x).classList.add("on")}function roster(){q("#roster").innerHTML="";P.forEach((p,i)=>{let b=document.createElement("button");b.className="person "+(sel.includes(i)?"sel":"");b.innerHTML=`<span class="tick">✓</span><img src="${p.img}"><div class="meta"><b>${p.name}</b><div class="stars">${"★".repeat(p.stars)}${"☆".repeat(5-p.stars)}</div><div class="trait">${p.trait}</div></div>`;b.onclick=()=>{if(sel.includes(i))sel=sel.filter(x=>x!=i);else if(sel.length<3)sel.push(i);roster()};q("#roster").appendChild(b)});q("#start").textContent=`Start Game · ${sel.length} selected`}function deck(){return S.flatMap(s=>Array.from({length:13},(_,i)=>({s:s.k,sym:s.s,red:s.r,r:i+1})))}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function legal(c){let b=bounds[c.s];return b?c.r==b.lo-1||c.r==b.hi+1:c.r==7}function opts(p){return hands[p].filter(legal)}function ai(p){let o=opts(p);if(!o.length)return null,st=players[p].style;if(st=="open")return o.sort((a,b)=>(!bounds[b.s])-(!bounds[a.s])||b.r-a.r)[0];if(st=="expert"||st=="block")return o.sort((a,b)=>(!!bounds[b.s])-(!!bounds[a.s])||b.r-a.r)[0];return o.sort((a,b)=>b.r-a.r)[0]}function playCard(p,c){selected=null;let i=hands[p].indexOf(c);if(i<0||!legal(c))return;hands[p].splice(i,1);if(!bounds[c.s])bounds[c.s]={lo:7,hi:7};else c.r<bounds[c.s].lo?bounds[c.s].lo=c.r:bounds[c.s].hi=c.r;render();if(!hands[p].length)return finish(p);turn=(p+1)%4;setTimeout(next,330)}function next(){if(!active||busy)return;render();let o=opts(turn);if(turn==0){q("#toast").textContent=o.length?"Your turn · play a card":"No legal card · pass";q("#pass").disabled=!!o.length;return}busy=true;let p=turn;setTimeout(()=>{let c=ai(p);if(c){q("#toast").textContent=`${players[p].name} played ${rn(c.r)}${c.sym}`;busy=false;playCard(p,c)}else{q("#toast").textContent=`${players[p].name} passes`;turn=(p+1)%4;busy=false;render();setTimeout(next,300)}},470)}function deal(){bounds={};hands=[[],[],[],[]];shuffle(deck()).forEach((c,i)=>hands[i%4].push(c));hands.forEach(h=>h.sort((a,b)=>a.s.localeCompare(b.s)||a.r-b.r));let st=hands.findIndex(h=>h.some(c=>c.s=="H"&&c.r==7));turn=st;active=true;render();q("#toast").textContent=`${players[st].name} has ♥7 · BADAAM SAAT!`;setTimeout(()=>playCard(st,hands[st].find(c=>c.s=="H"&&c.r==7)),600)}function finish(w){active=false;let pts=hands.map((h,i)=>i==w?0:h.reduce((n,c)=>n+c.r,0));scores=scores.map((x,i)=>x+pts[i]);hist.push(pts);scoreboard();q("#toast").textContent=`${players[w].name} wins!`}function board(){q("#board").innerHTML="";S.forEach(s=>{let l=document.createElement("div");l.className="lane";let b=bounds[s.k],cards="";if(b)for(let r=b.lo;r<=b.hi;r++){let d=r-7;cards+=`<div class="mini ${s.r?"red":""} ${r==7?"seven":""}" style="--y:${d*25}px;--r:${d*.35}deg;z-index:${20+r}">${rn(r)}${s.s}</div>`}else cards='<div class="ghost">7</div>';l.innerHTML=`<div class="suit ${s.r?"red":""}">${s.s}</div><div class="stack">${cards}</div>`;q("#board").appendChild(l)})}function hand(){let e=q("#hand");e.innerHTML="";let n=hands[0].length,spread=Math.min(250,Math.max(160,n*20));hands[0].forEach((c,i)=>{let b=document.createElement("button"),ok=active&&turn==0&&legal(c),t=n<2?0:i/(n-1)-.5,x=t*spread,rot=t*20,y=Math.abs(t)*13+(selected===c?-17:ok?-5:0);b.className=`card ${c.red?"red":""} ${ok?"playable":""} ${selected===c?"selected":""}`;b.disabled=!ok;b.style.transform=`translateX(calc(-50% + ${x}px)) translateY(${y}px) rotate(${rot}deg)`;b.style.zIndex=20+i;b.innerHTML=`${rn(c.r)}${c.sym}<span class="big">${c.sym}</span>`;b.onclick=()=>{if(selected===c)playCard(0,c);else{selected=c;hand();q("#toast").textContent=`${rn(c.r)}${c.sym} · tap again to play`}};e.appendChild(b)})}function render(){board();hand();[1,2,3].forEach(p=>q("#seat"+p).innerHTML=`<img src="${players[p].img}"><b>${players[p].name}</b><span>${hands[p].length} cards</span><div class="backs">${Array.from({length:Math.min(7,hands[p].length)},()=>'<i class="cb"></i>').join("")}</div>`);if(turn!=0)q("#pass").disabled=true}function scoreboard(){q("#scoreBody").innerHTML=`<table><tr><th>Player</th><th>Total</th></tr>${players.map((p,i)=>`<tr><td>${p.name}</td><td>${scores[i]}</td></tr>`).join("")}</table>`}q("#play").onclick=q("#opponents").onclick=()=>show("choose");q("#back").onclick=q("#menu").onclick=()=>show("home");q("#start").onclick=()=>{if(sel.length!=3)return;players=[{name:"You",style:"human",img:""},...sel.map(i=>P[i])];show("game");deal()};q("#pass").onclick=()=>{if(turn||opts(0).length)return;turn=1;render();next()};q("#scores").onclick=()=>q("#score").classList.add("on");q("#close").onclick=()=>q("#score").classList.remove("on");roster()})();
</script></body></html>
